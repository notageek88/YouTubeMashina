name: Build Mac from private (two DMGs)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-mac-from-private.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Private branch, tag, or SHA to build
        required: true
        default: dev-last-v

env:
  PRIVATE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || 'afc1906f4d3e3f848b2266d93812b5633dc5e3e9' }}
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: notageek88/youtube-mashina
          ref: ${{ env.PRIVATE_REF }}
          token: ${{ secrets.PRIVATE_SRC_PAT }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            machine: x86_64
            target: x86_64-apple-darwin
            deployment_target: "10.13"
            dmg: YouTube-MASHINA-macos-x64.dmg
          - arch: arm64
            runner: macos-15
            machine: arm64
            target: aarch64-apple-darwin
            deployment_target: "11.0"
            dmg: YouTube-MASHINA-macos-arm64.dmg
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
      SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: notageek88/youtube-mashina
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.PRIVATE_SRC_PAT }}

      - name: Verify native runner
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          echo "source=$SOURCE_SHA arch=$(uname -m) target=${{ matrix.target }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Install build dependencies
        run: |
          brew install ffmpeg create-dmg
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt pytest "pyinstaller>=6.0"

      - name: Test packaging helpers
        run: python -m pytest tests/test_verify_macos_arch.py tests/test_package_extension.py tests/test_bundle_macos_ffmpeg.py tests/test_macos_workflow_contract.py -q

      - name: Bundle ffmpeg and build backend
        run: |
          python scripts/bundle_macos_ffmpeg.py --output data/bin
          test -f configs/config.py || cp configs/config.example.py configs/config.py
          bash scripts/build_backend.sh

      - name: Stage backend and build Tauri app
        run: |
          mkdir -p ui/src-tauri/resources
          find ui/src-tauri/resources -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R dist/youtube-mashina-backend/. ui/src-tauri/resources/
          cd ui
          npm ci
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("src-tauri/tauri.conf.json")
          config = json.loads(path.read_text())
          config["bundle"]["targets"] = ["app"]
          config["bundle"]["createUpdaterArtifacts"] = False
          config["bundle"]["macOS"]["minimumSystemVersion"] = "${{ matrix.deployment_target }}"
          config.setdefault("plugins", {}).setdefault("updater", {})["active"] = False
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY
          npm run tauri:build -- --bundles app --target "${{ matrix.target }}"

      - name: Patch, sign and verify app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          bash scripts/patch_macos_app.sh "${{ matrix.target }}"
          APP="ui/src-tauri/target/${{ matrix.target }}/release/bundle/macos/YouTube MASHINA.app"
          python scripts/verify_macos_arch.py --arch "${{ matrix.machine }}" "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Create and verify DMG
        run: |
          APP="ui/src-tauri/target/${{ matrix.target }}/release/bundle/macos/YouTube MASHINA.app"
          mkdir -p release dmg-staging
          cp -R "$APP" dmg-staging/
          create-dmg --volname "YouTube MASHINA" --window-size 700 450 --icon-size 100 --app-drop-link 525 225 --no-internet-enable "release/${{ matrix.dmg }}" dmg-staging || hdiutil create -volname "YouTube MASHINA" -srcfolder dmg-staging -ov -format UDZO "release/${{ matrix.dmg }}"
          hdiutil verify "release/${{ matrix.dmg }}"
          printf '%s\n' "$SOURCE_SHA" > "release/${{ matrix.dmg }}.source-sha.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: youtube-mashina-macos-${{ matrix.arch }}
          path: |
            release/${{ matrix.dmg }}
            release/${{ matrix.dmg }}.source-sha.txt
          if-no-files-found: error
          retention-days: 30

  extension:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: notageek88/youtube-mashina
          ref: ${{ needs.resolve.outputs.source_sha }}
          token: ${{ secrets.PRIVATE_SRC_PAT }}
      - name: Package extension
        run: |
          mkdir -p release
          python scripts/package_extension.py ui/extension release/YouTube-MASHINA-extension.zip
          unzip -t release/YouTube-MASHINA-extension.zip
          printf '%s\n' "${{ needs.resolve.outputs.source_sha }}" > release/YouTube-MASHINA-extension.zip.source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-mashina-extension
          path: |
            release/YouTube-MASHINA-extension.zip
            release/YouTube-MASHINA-extension.zip.source-sha.txt
          if-no-files-found: error
          retention-days: 30
